# cargo-deny policy: run with `cargo deny check` (see scripts/verify.sh).

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
# Vulnerabilities fail the check by default; each ignored advisory needs an id and a one-line reason.
ignore = [
    # chrono is pulled in by rmcp and schemars; no fixed version exists, so it cannot be upgraded here.
    { id = "RUSTSEC-2026-0543", reason = "unmaintained chrono, transitive via rmcp/schemars; no safe upgrade" },
]

[licenses]
# Only permissive licenses present in the dependency tree; r-efi is accepted through its MIT option.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
# Duplicate versions are reported without failing the check.
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
