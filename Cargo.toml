[package]
name = "postgres-mcp"
version = "0.1.6"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Read-only MCP server for PostgreSQL and TimescaleDB"
repository = "https://github.com/matpb/postgres-mcp-rs"
readme = "README.md"
keywords = ["mcp", "postgres", "timescaledb", "read-only", "ai"]
categories = ["database", "command-line-utilities"]

[lib]
name = "postgres_mcp"
path = "src/lib.rs"

[[bin]]
name = "postgres-mcp"
path = "src/main.rs"

[dependencies]
axum = "0.8"
bytes = "1"
fallible-iterator = "0.2"
http = "1"
pg_query = "18.1"
postgres-protocol = "0.6.12"
prost = { version = "0.13", features = ["no-recursion-limit"] }
rmcp = { version = "3.11", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = "0.7"
tower = { version = "0.5", features = ["limit", "timeout", "util"] }
tower-http = { version = "0.7", features = ["cors", "limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
webpki-roots = "1"

[dev-dependencies]
http-body-util = "0.1"
proptest = "1"
rcgen = "0.14.10"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 4
